apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecom-ai-api
  namespace: telecom-ai
  labels:
    app: telecom-ai-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: telecom-ai-api
  template:
    metadata:
      labels:
        app: telecom-ai-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: telecom-ai-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: api
        image: telecom-ai/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATA_SOURCE
          value: "prometheus"
        - name: PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: telecom-ai-config
              key: prometheus_url
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: telecom-ai-config
              key: kafka_brokers
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: telecom-ai-secrets
              key: database_url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: telecom-ai-secrets
              key: openai_api_key
              optional: true
        - name: SLACK_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: telecom-ai-secrets
              key: slack_webhook
              optional: true
        - name: LOG_LEVEL
          value: "INFO"
        
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - telecom-ai-api
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: telecom-ai-api
  namespace: telecom-ai
  labels:
    app: telecom-ai-api
spec:
  type: ClusterIP
  selector:
    app: telecom-ai-api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telecom-ai-api-hpa
  namespace: telecom-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telecom-ai-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: telecom-ai-api-pdb
  namespace: telecom-ai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: telecom-ai-api
