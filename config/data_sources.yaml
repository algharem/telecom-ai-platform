# Data Source Configuration
# Switch between prometheus, simulator, and log sources

# Active data source: "prometheus", "simulator", or "logs"
data_source: "simulator"

# Prometheus configuration (used when data_source: prometheus)
prometheus:
  enabled: false
  url: "http://172.25.0.36:9090"
  gnb_id: "gNB-001"
  
  # KPI derivation parameters (map core metrics to RAN KPIs)
  derivation:
    # Base PRB usage percentage
    prb_base: 20.0
    
    # Additional PRB % per registered UE
    prb_per_ue: 15.0
    
    # Estimated throughput per PDU session (Mbps)
    mbps_per_session: 5.0
    
    # Base latency in milliseconds
    latency_base_ms: 20.0
    
    # Latency penalty per unit auth failure rate (ms)
    latency_penalty_ms: 100.0
  
  # Gauge metrics (current state) from actual Open5GS Prometheus deployment
  gauge_metrics:
    # AMF subscription metrics
    - fivegs_amffunction_rm_registeredsubnbr      # Registered subscribers
    # SMF session metrics
    - fivegs_smffunction_sm_sessionnbr            # PDU sessions
    - fivegs_smffunction_sm_qos_flow_nbr          # QoS flows
    # UPF metrics
    - fivegs_upffunction_upf_sessionnbr           # UPF active sessions
    - fivegs_upffunction_upf_qosflows             # UPF QoS flows
    # PCF metrics
    - fivegs_pcffunction_pa_sessionnbr            # PCF active sessions
    # System metrics
    - ues_active                                  # Total active UEs
    - bearers_active                              # Total active bearers
    - gtp2_sessions_active                        # Active GTP2 sessions
    - pfcp_sessions_active                        # Active PFCP sessions
    - pfcp_peers_active                           # Active PFCP peers
  
  # Rate metrics (counters - calculate rates over 5m window)
  rate_metrics:
    # AMF Registration metrics
    - fivegs_amffunction_rm_reginitreq            # Registration initiation requests
    - fivegs_amffunction_rm_reginitsucc           # Registration initiation success
    - fivegs_amffunction_rm_reginitfail           # Registration initiation failure
    - fivegs_amffunction_rm_regmobreq             # Registration mobility requests
    - fivegs_amffunction_rm_regmobsucc            # Registration mobility success
    - fivegs_amffunction_rm_regperiodreq          # Registration periodic requests
    - fivegs_amffunction_rm_regperiodsucc         # Registration periodic success
    - fivegs_amffunction_rm_regemergreq           # Emergency registration requests
    - fivegs_amffunction_rm_regemergsucc          # Emergency registration success
    
    # AMF Authentication metrics
    - fivegs_amffunction_amf_authreq              # Authentication requests
    - fivegs_amffunction_amf_authfail             # Authentication failures
    - fivegs_amffunction_amf_authreject           # Authentication rejects
    
    # AMF Paging metrics
    - fivegs_amffunction_mm_paging5greq           # 5G paging requests
    - fivegs_amffunction_mm_paging5gsucc          # 5G paging success
    
    # AMF Configuration update
    - fivegs_amffunction_mm_confupdate            # Configuration update requests
    - fivegs_amffunction_mm_confupdatesucc        # Configuration update success
    
    # SMF PDU Session metrics
    - fivegs_smffunction_sm_pdusessioncreationreq   # PDU session creation requests
    - fivegs_smffunction_sm_pdusessioncreationsucc  # PDU session creation success
    - fivegs_smffunction_sm_n4sessionestabreq       # SMF N4 session establishment
    - fivegs_smffunction_sm_n4sessionreport         # SMF N4 session reports
    - fivegs_smffunction_sm_n4sessionreportsucc     # SMF N4 session report success
    
    # UPF N4 metrics
    - fivegs_upffunction_sm_n4sessionestabreq       # UPF N4 session establishment
    - fivegs_upffunction_sm_n4sessionreport         # UPF N4 session reports
    - fivegs_upffunction_sm_n4sessionreportsucc     # UPF N4 session report success
    
    # Data Plane (N3 interface)
    - fivegs_ep_n3_gtp_indatapktn3upf            # N3 inbound data packets
    - fivegs_ep_n3_gtp_outdatapktn3upf           # N3 outbound data packets
    
    # PCF Policy metrics
    - fivegs_pcffunction_pa_policyamassoreq      # PCF AM policy requests
    - fivegs_pcffunction_pa_policyamassosucc     # PCF AM policy success
    - fivegs_pcffunction_pa_policysmassoreq      # PCF SM policy requests
    - fivegs_pcffunction_pa_policysmassosucc     # PCF SM policy success
    
    # GTP/PFCP protocol metrics
    - gn_rx_createpdpcontextreq                  # Create PDP context requests (4G)
    - gn_rx_deletepdpcontextreq                  # Delete PDP context requests (4G)
    - s5c_rx_createsession                       # Create session requests (4G)
    - s5c_rx_deletesession                       # Delete session requests (4G)

# Simulator configuration (used when data_source: simulator)
simulator:
  enabled: true
  base_stations: 10
  random_seed: 42
  hours: 168
  anomaly_rate: 0.05

# Log file configuration (used when data_source: logs)
logs:
  enabled: false
  base_path: "/var/log/open5gs"
  
  # Network functions to monitor
  watched_nfs:
    - amf
    - upf
    - nrf
    - ausf
  
  # How often to poll for new logs (seconds)
  polling_interval_seconds: 5
  
  # Log aggregation settings
  aggregation:
    # Time window for KPI metrics (seconds)
    window_seconds: 60
    
    # Maximum records to buffer before flushing
    max_buffer_size: 10000
    
    # Flush interval if buffer not full (seconds)
    flush_interval_seconds: 30

# Anomaly detection thresholds
anomaly_detection:
  enabled: true
  
  # Pattern-based thresholds
  thresholds:
    # PRB usage > 90% indicates congestion
    prb_usage_percent: 90
    
    # Latency > 50ms indicates issues
    latency_ms: 50
    
    # Packet loss > 1% indicates problems
    packet_loss_percent: 1
    
    # Registration success < 95% (for anomaly labeling)
    registration_success_rate_percent: 95
    
    # Throughput drop > 20% in sliding window
    throughput_drop_percent: 20

# Monitoring and observability
monitoring:
  enabled: true
  
  # Track metrics per minute
  metrics_window_minutes: 1
  
  # Keep stats for last N minutes
  retention_minutes: 60
  
  # Log level for pipeline
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
