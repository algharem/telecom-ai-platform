groups:
- name: telecom-ai-alerts
  interval: 30s
  rules:
  
  # API availability
  - alert: APIDown
    expr: up{job="telecom-ai-api"} == 0
    for: 1m
    labels:
      severity: critical
      component: api
    annotations:
      summary: "Telecom AI API is down"
      description: "API instance {{ $labels.instance }} has been down for 1 minute"
  
  # High CPU usage
  - alert: HighCPUUsage
    expr: |
      (sum(rate(container_cpu_usage_seconds_total{pod=~"telecom-ai-.*"}[5m])) by (pod) / 
       sum(container_spec_cpu_quota{pod=~"telecom-ai-.*"}/container_spec_cpu_period{pod=~"telecom-ai-.*"}) by (pod)) > 0.8
    for: 5m
    labels:
      severity: warning
      component: compute
    annotations:
      summary: "High CPU usage on {{ $labels.pod }}"
      description: "Pod {{ $labels.pod }} CPU usage is above 80%"
  
  # High memory usage
  - alert: HighMemoryUsage
    expr: |
      (sum(container_memory_working_set_bytes{pod=~"telecom-ai-.*"}) by (pod) /
       sum(container_spec_memory_limit_bytes{pod=~"telecom-ai-.*"}) by (pod)) > 0.85
    for: 5m
    labels:
      severity: warning
      component: compute
    annotations:
      summary: "High memory usage on {{ $labels.pod }}"
      description: "Pod {{ $labels.pod }} memory usage is above 85%"
  
  # Kafka lag
  - alert: HighKafkaLag
    expr: kafka_consumergroup_lag{group=~"anomaly-.*|incident-.*"} > 10000
    for: 5m
    labels:
      severity: warning
      component: streaming
    annotations:
      summary: "High Kafka consumer lag for {{ $labels.group }}"
      description: "Consumer group {{ $labels.group }} has lag of {{ $value }} messages"
  
  # Database connection issues
  - alert: DatabaseConnectionPoolExhausted
    expr: |
      (sum(pg_stat_activity_count{datname="telecomaidb"}) by (instance) /
       sum(max_connections_setting{datname="telecomaidb"}) by (instance)) > 0.8
    for: 5m
    labels:
      severity: critical
      component: database
    annotations:
      summary: "Database connection pool exhausted on {{ $labels.instance }}"
      description: "Database connection pool usage is above 80%"
  
  # Anomaly detection latency
  - alert: AnomalyDetectionLatencyHigh
    expr: histogram_quantile(0.95, rate(prediction_latency_seconds_bucket[5m])) > 5
    for: 5m
    labels:
      severity: warning
      component: ml
    annotations:
      summary: "High anomaly detection latency"
      description: "95th percentile latency is {{ $value }}s"
  
  # High anomaly rate
  - alert: HighAnomalyDetectionRate
    expr: rate(anomalies_detected_total[5m]) > 10
    for: 5m
    labels:
      severity: major
      component: ml
    annotations:
      summary: "High anomaly detection rate"
      description: "Detecting {{ $value }} anomalies per second"
  
  # Critical incidents
  - alert: CriticalIncidentDetected
    expr: ALERTS{severity="critical"} > 0
    for: 1m
    labels:
      severity: critical
      component: incidents
    annotations:
      summary: "Critical incident detected"
      description: "{{ $value }} critical alerts are active"
